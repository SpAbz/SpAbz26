<!DOCTYPE html>
<html>
  <head>

    <meta charset="UTF-8"/>
    <link href="index.css" rel="stylesheet" type="text/css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <title>Ergebniss</title>
    <link rel="SHORTCUT ICON" href="favicon.ico" type="image/x-icon">
    <script src="js/result.js" type="text/javascript"></script>

<style>
td {
   width:200px;
   text-align:left;
/*   line-height:25px;*/
   line-height:30px;
   padding:10px;
   background-color:#FFFF00;
   border-radius: 5px;
   }

td input {
  height: 30px;
}

#dsabz th {
  background-color:#FFFF00;
}

#dsabz td {
  margin:0;
  padding:0;
  background-color:#FFCC00;
  text-align:center;
}

#diszip {
  font-weight:bold;
  height:20px;
  margin-bottom:5px;
  }
</style>

</head>
<body id="result" >
  <div id="wrapper">
     <div id="head">
        <h2>Sportabzeichen</h2>
     </div>
     <form name="localForm">
        <table>
           <tr>
             <td><label for="alter" >Alter:</label></td>
             <td><input type="text" name="alter" style="width:38px;" maxlength="2">&nbsp;Jahre</td>
           </tr>
           <tr>
             <td><label for="typ">Disziplin:</label></td>
             <td>
               <select name="typ" size="1" style="height:40px;">
                 <option>Ball-umgreifen</option>
                 <option>Kickfangen</option>
                 <option>Koordinations-T-Lauf</option>
                 <option>Koordinationsleiter</option>
               </select>
             </td>
           </tr>
           <tr>
             <td><label for="sex" >Geschlecht:</label></td>
             <td>
               <select name="sex" id="sex" size="1" style="height:40px; width:45px;">
                 <option>W</option>
                 <option>M</option>
               </select>
             </td>
           </tr>
           <tr>
             <td><label for="leistung" >Leistung:</label></td>
             <td><input type="text" name="leistung" style="width:38px;">&nbsp;Anzahl/Zeit</td>
           </tr>
        </table>
        <!--button type="reset">Eingaben zur cksetzen</button-->
        <div align="center" ><button type="submit">Ergebniss</button></div>
     </form>
     <h3>Wertung f&uuml;r Disziplin</h3>
     <div>
        <table id="dsabz">
          <caption id="diszip">&nbsp;</caption>
          <tr>
            <th id="leistung">&nbsp;</th><th id="sollbz">&nbsp;</th>
            <th id="sollsb">&nbsp;</th><th id="sollgd">&nbsp;</th>
          </tr>
          <tr>
            <td><img id="ug" src="img/ug.gif" height="50" width="50"  alt="" /></td>
            <td><img id="bz" src="img/bz.gif" height="50" width="50" alt="" /></td>
            <td><img id="sb" src="img/sb.gif" height="50" width="50" alt="" /></td>
            <td><img id="gd" src="img/gd.gif" height="50" width="50" alt="" /></td>
          </tr>
        </table>
        </div>
        <div align="center" >
          <button class="redButton" onClick="parent.location='index.html'" >Zur&uuml;ck</button>
        </div>
     </div>
</body>
</html>
