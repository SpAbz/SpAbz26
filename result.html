}

function setStyle(result) {

         gd.style.backgroundColor="#FFCC00";

    case 0:
        ug.style.borderStyle = "solid";
        ug.style.backgroundColor = "#FF0000";
        break;
    case 1:

        break;
    case 2:

        break;
    case 3:

}
}


function ergebnis(ist, soll, tidx) {
let res = 0;
let i;
    if ( tidx < 2 ) {   // Anzahl
         for (i =0; i<3; i++) {
            if (ist >= soll[i]) { res++ }
         }
    } else {

 // window.alert("value soll "+ist+" "+soll[i]);

         }

    return res;
}
